<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Nexus Staff Transfer Portal slide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{--ink:#262122;--blue:#276898;--blue-deep:#004d7d;--blue-light:#3380b0;--sky:#8fc1e3;--alert:#e4482e;--paper:#fff}
html,body{margin:0;padding:0;overflow:hidden}
body{width:1920px;height:1080px;overflow:hidden;background:var(--ink);color:#fff;font-family:'Merriweather',Georgia,serif;position:relative}
.glow{position:absolute;right:0;top:-260px;width:900px;height:1100px;border-radius:50%;background:radial-gradient(closest-side,rgba(39,104,152,.55),rgba(39,104,152,0));pointer-events:none}
.left{position:absolute;left:110px;top:84px;width:960px;display:grid;gap:26px}
.logo{width:430px;height:auto;display:block}
.eyebrow{font-family:'Oswald',sans-serif;font-weight:500;font-size:30px;letter-spacing:.22em;text-transform:uppercase;color:var(--sky);margin:0}
h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:150px;line-height:.93;letter-spacing:-.01em;text-transform:uppercase;margin:0;color:#fff}
h1 span{color:var(--sky)}
.sub{font-size:36px;line-height:1.35;font-style:italic;color:#d9d9d9;margin:0;max-width:900px}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:12px;font-family:'Oswald',sans-serif;font-weight:700;font-size:26px;letter-spacing:.16em;text-transform:uppercase;border-radius:999px;padding:12px 24px;border:2px solid rgba(255,255,255,.35)}
.chip .dot{width:16px;height:16px;border-radius:50%;background:#43d17a;box-shadow:0 0 0 7px rgba(67,209,122,.22)}
.chip.alert{background:var(--alert);border-color:var(--alert)}
.note{font-size:24px;color:#a9a9a9;margin:0}
.card{position:absolute;right:110px;top:132px;width:640px;background:var(--paper);border-radius:28px;padding:40px 40px 34px;display:grid;gap:22px;justify-items:center;box-shadow:0 30px 70px -30px rgba(0,0,0,.8)}
.card img{width:560px;height:560px;display:block;image-rendering:pixelated}
.card .scan{font-family:'Oswald',sans-serif;font-weight:700;font-size:38px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin:0;text-align:center;line-height:1.1}
.card .url{font-family:'Oswald',sans-serif;font-weight:500;font-size:22px;letter-spacing:.04em;color:#524e4f;margin:0;text-align:center;word-break:break-all}
.foot{position:absolute;right:110px;bottom:56px;display:flex;align-items:center;gap:28px}
.foot img{height:72px;width:auto;display:block}
.foot .site{font-family:'Oswald',sans-serif;font-weight:500;font-size:30px;letter-spacing:.2em;text-transform:uppercase;color:#a9a9a9}
</style></head><body>
<div class="glow"></div>
<div class="left">
  <img class="logo" src="{{LOGO_WHITE}}" alt="Nexus: Church Planting &amp; Leader Care">
  <p class="eyebrow">A Leader Care initiative*</p>
  <h1>Staff<br>Transfer<br><span>Portal</span></h1>
  <p class="sub">Now open. Two destinations. Zero winters in common.</p>
  <div class="row"><span class="chip"><span class="dot"></span>Portal open</span><span class="chip alert">Breaking: worship leaders entering</span></div>
  <p class="note">*Not an initiative. Not approved. Stay planted.</p>
</div>
<div class="card">
  <img src="{{QR}}" alt="QR code to the Nexus Staff Transfer Portal">
  <p class="scan">Scan to enter the portal</p>
  <p class="url">{{URL_SHORT}}</p>
</div>
<div class="foot">
  <img src="{{THINKNEXT}}" alt="ThinkNEXT">
  <span class="site">ThinkNEXT 2026 · nexus.us</span>
</div>
</body></html>
